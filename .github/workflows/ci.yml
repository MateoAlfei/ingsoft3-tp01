name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests con coverage
        run: |
          mkdir -p TestResults
          docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Reporte de coverage
        if: ${{ !cancelled() }}
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"TestResults/coverage.cobertura.xml" -sourcedirs:backend -targetdir:coveragereport "-reporttypes:Html;MarkdownSummaryGithub"
          cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Subir el reporte como artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-backend
          path: |
            coveragereport
            TestResults/tests.trx

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mateoalfei/ingsoft3-tp01-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests con coverage
        run: |
          mkdir -p coverage-frontend
          docker run --rm -v "${{ github.workspace }}/coverage-frontend:/salida" frontend-test:ci --coverage.reportsDirectory=/salida/reporte

      - name: Resumen de coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          test -f coverage-frontend/reporte/coverage-summary.json
          jq -r '"### Coverage del frontend\n\n| Métrica | % |\n|---|---|\n| Líneas | \(.total.lines.pct) |\n| Ramas | \(.total.branches.pct) |\n| Funciones | \(.total.functions.pct) |\n| Statements | \(.total.statements.pct) |"' coverage-frontend/reporte/coverage-summary.json >> $GITHUB_STEP_SUMMARY

      - name: Subir el reporte como artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-frontend
          path: coverage-frontend/reporte

      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/mateoalfei/ingsoft3-tp01-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=
  deploy-qa:
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qa
    permissions: {}
    env:
      API_URL: https://appgastos-api-qa.onrender.com
      FRONT_URL: https://appgastos-front-qa.onrender.com
    steps:
      - name: Pedir deploy del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        run: |
          curl -fsS -o /dev/null "${HOOK_API}&ref=${GITHUB_SHA}"
          curl -fsS -o /dev/null "${HOOK_FRONT}&ref=${GITHUB_SHA}"

      - name: Smoke test de QA (con reintentos)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$API_URL/api/health/db" > /dev/null \
              && curl -fsS --max-time 10 "$FRONT_URL/" > /dev/null \
              && curl -fsS --max-time 10 "$FRONT_URL/api/health" > /dev/null; then
              echo "QA responde OK"
              exit 0
            fi
            echo "Intento $i falló, reintento en 20s"
            sleep 20
          done
          echo "El smoke test de QA falló"
          exit 1
  deploy-prod:
    needs: deploy-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions: {}
    env:
      API_URL: <URL-API-PROD>
      FRONT_URL: <URL-FRONT-PROD>
    steps:
      - name: Pedir deploy del commit verificado en QA
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_PROD }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_PROD }}
        run: |
          curl -fsS -o /dev/null "${HOOK_API}&ref=${GITHUB_SHA}"
          curl -fsS -o /dev/null "${HOOK_FRONT}&ref=${GITHUB_SHA}"

      - name: Smoke test de PROD (con reintentos)
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$API_URL/api/health/db" > /dev/null \
              && curl -fsS --max-time 10 "$FRONT_URL/" > /dev/null \
              && curl -fsS --max-time 10 "$FRONT_URL/api/health" > /dev/null; then
              echo "PROD responde OK"
              exit 0
            fi
            echo "Intento $i falló, reintento en 20s"
            sleep 20
          done
          echo "El smoke test de PROD falló"
          exit 1